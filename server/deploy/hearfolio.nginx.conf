limit_req_zone $binary_remote_addr zone=hearfolio_requests:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=hearfolio_registration:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=hearfolio_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name hearfolio.corextech.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hearfolio.corextech.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/hearfolio.corextech.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hearfolio.corextech.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 5m;
    limit_conn hearfolio_connections 20;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;

    location = /register {
        limit_req zone=hearfolio_registration burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
    location = /join {
        limit_req zone=hearfolio_registration burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
    location / {
        limit_req zone=hearfolio_requests burst=200 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
}
