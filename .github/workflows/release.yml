name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to retry (empty creates the next release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hearfolio-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.sha }}
  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      released: ${{ steps.prepare.outputs.released }}
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare immutable release ref
        id: prepare
        env:
          RETRY_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$RETRY_TAG" ]]; then
            [[ "$RETRY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid release tag'; exit 1; }
            git merge-base --is-ancestor "$RETRY_TAG" origin/main
            [[ "$RETRY_TAG" == "$(node scripts/release.mjs latest-tag origin/main)" ]] || { echo 'Retry the newest release tag to preserve the update channel'; exit 1; }
            git checkout --detach "$RETRY_TAG"
            VERSION="$(node scripts/release.mjs check)"
            [[ "v$VERSION" == "$RETRY_TAG" ]]
            if gh release view "$RETRY_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt" 2>/dev/null; then
              if [[ "$(cat "$RUNNER_TEMP/release-draft.txt")" == false ]]; then
                echo 'Release is already published; its assets are immutable.'
                echo 'released=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo 'released=true' >> "$GITHUB_OUTPUT"
            echo "tag=$RETRY_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            node scripts/release.mjs prepare
          fi
  desktop:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: universal-apple-darwin
            platform: darwin_universal
            bundles: app,dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux_x86_64
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build signed desktop updater and installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
          node scripts/release.mjs check
          npm run tauri -- build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' -- --locked
      - name: Collect all required desktop assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node scripts/release-artifacts.mjs stage "$RELEASE_VERSION" "$RELEASE_PLATFORM" "src-tauri/target/$RELEASE_TARGET/release/bundle" release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
  android:
    needs: prepare
    if: needs.prepare.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Build arm64 APK and AAB
        run: |
          node scripts/release.mjs check
          npm run tauri -- android build --ci --apk --aab --target aarch64
          git diff --exit-code -- src-tauri/Cargo.lock package-lock.json
      - name: Sign Android packages and verify signatures
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release-android.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android_aarch64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check out the release tooling from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Validate the complete release and generate updater manifests
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node .release-tools/scripts/release.mjs notes "$RELEASE_TAG"
          node .release-tools/scripts/release-artifacts.mjs manifest "$RELEASE_VERSION" "$GITHUB_REPOSITORY" release-assets release-notes.md
      - name: Preserve final release assets in Actions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-${{ needs.prepare.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload draft release and publish after all assets exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt" 2>/dev/null; then
            [[ "$(cat "$RUNNER_TEMP/release-draft.txt")" == true ]] || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft --title "Hearfolio $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --latest
