name: Docker Build & Publish

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: hearfolio-docker-publish
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || format('{0}/hearfolio', secrets.DOCKERHUB_USERNAME) }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Resolve the release produced by this run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts" > "$RUNNER_TEMP/release-artifacts.json"
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const pages = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/release-artifacts.json', 'utf8'));
          const names = pages.flatMap(p => p.artifacts).filter(a => !a.expired && /^complete-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(a.name)).map(a => a.name);
          if (names.length > 1) throw new Error('Ambiguous release artifacts');
          const tag = names[0]?.slice('complete-'.length);
          appendFileSync(process.env.GITHUB_OUTPUT, tag ? `released=true\ntag=${tag}\nversion=${tag.slice(1)}\n` : 'released=false\n');
          JS

      - name: Check out the released tag
        if: steps.release.outputs.released == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: steps.release.outputs.released == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate release and Docker Hub configuration
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_PASSWORD" ]] || { echo 'Set DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD repository secrets'; exit 1; }
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]] || { echo 'IMAGE_NAME must be a lowercase Docker Hub namespace/repository'; exit 1; }
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | any')" == false ]]
          [[ "$(node scripts/release.mjs check)" == "$RELEASE_VERSION" ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test relay protocol
        if: steps.release.outputs.released == 'true'
        run: node --experimental-strip-types --test server/*.test.mjs

      - name: Set up QEMU
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        if: steps.release.outputs.released == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ env.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Log in to Docker Hub
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push relay image
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hearfolio-relay
          cache-to: type=gha,mode=max,scope=hearfolio-relay
