name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit or tag to check
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same pull request makes the older check run obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Checks never need debugger symbols; skipping them shortens linking and keeps caches small.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  conventions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/release.mjs check
      - run: node --test scripts/release.test.mjs scripts/prepare-android.test.mjs
      - run: npm run test:transfer
      - run: bash -n scripts/release-android.sh
      - name: Validate PR title for squash merge
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release.mjs lint-title
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            node scripts/release.mjs lint-range
          else
            node scripts/release.mjs lint-range "$BASE_SHA"
          fi
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-desktop
        with:
          cache-target: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target '${{ matrix.target }}'
      # A debug build reuses the dependencies cargo test just compiled. The
      # optimised, LTO release build runs only in the release workflow.
      - run: npm run tauri -- build --ci --debug --target '${{ matrix.target }}' --no-bundle -- --locked
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      # The emulator smoke test needs only x86_64; the release workflow builds arm64.
      - name: Build Android emulator APK without release secrets
        run: npm run tauri -- android build --ci --debug --apk --split-per-abi --target x86_64
      - name: Test Android recorder source and gain control lifecycle
        working-directory: src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-recording:testDebugUnitTest
      - name: Ensure Android builds use the checked dependency locks
        run: git diff --exit-code -- src-tauri/Cargo.lock package-lock.json
      - name: Upload Android smoke build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-${{ github.run_id }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-${{ github.run_id }}
          path: android-debug
      - name: Enable KVM access for the hosted Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android recorder UI and native capture
        uses: reactivecircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586 # v2.36.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-boot-anim -noaudio -gpu swiftshader_indirect -camera-back none -camera-front none
          pre-emulator-launch-script: |
            echo 'hw.audioInput=no' >> "$HOME/.android/avd/test.avd/config.ini"
          script: python3 scripts/android-recorder-smoke.py --apk "$(find android-debug -type f -name '*x86_64*debug*.apk' -print -quit)" --output android-runtime-results
      - name: Preserve runtime crash logs, snapshots, screenshot and PCM recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-runtime-${{ github.run_id }}
          path: android-runtime-results
          if-no-files-found: warn
          retention-days: 7
