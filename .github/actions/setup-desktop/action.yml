name: Set up desktop build
description: Install pinned Node, Rust, and the Tauri Linux libraries
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: stable
        components: rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        cache-on-failure: true
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
        # Tauri's GStreamer plugin copies every file in its source directory.
        # Use an explicit directory containing only the selected plugin packages,
        # even if the hosted runner has other GStreamer plugins preinstalled.
        media_plugins="$RUNNER_TEMP/hearfolio-gstreamer-plugins"
        mkdir -p "$media_plugins"
        for plugin_package in gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav; do
          while IFS= read -r plugin_file; do
            if [[ "$plugin_file" == */gstreamer-1.0/*.so && -f "$plugin_file" ]]; then
              cp "$plugin_file" "$media_plugins/"
            fi
          done < <(dpkg -L "$plugin_package")
        done
        echo "GSTREAMER_PLUGINS_DIR=$media_plugins" >> "$GITHUB_ENV"
        for media_element in qtdemux aacparse mpegaudioparse avdec_aac avdec_mp3 audioconvert audioresample decodebin; do
          env GST_PLUGIN_SYSTEM_PATH_1_0="$media_plugins" GST_PLUGIN_PATH_1_0="$media_plugins" \
            GST_REGISTRY_1_0="$RUNNER_TEMP/hearfolio-gst-registry.bin" gst-inspect-1.0 "$media_element" > /dev/null
        done
    - shell: bash
      run: npm ci
